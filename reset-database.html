<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Database - Runeterra</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl font-bold mb-6">🔄 Reset Database</h1>

      <!-- Status -->
      <div
        id="status"
        class="bg-blue-900/30 border border-blue-600/50 rounded-lg p-4 mb-6"
      >
        <h3 class="text-lg font-bold text-blue-300 mb-2">📊 Current Status</h3>
        <p id="statusText" class="text-slate-300">Checking database...</p>
      </div>

      <!-- Controls -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <button
          onclick="checkDatabase()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition-all"
        >
          🔍 Check Database
        </button>
        <button
          onclick="clearDatabase()"
          class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded transition-all"
        >
          🗑️ Clear Database
        </button>
        <button
          onclick="reloadSample()"
          class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded transition-all"
        >
          ✨ Load Sample Data
        </button>
      </div>

      <!-- Actions -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <button
          onclick="goToMain()"
          class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded transition-all"
        >
          🏠 Back to Main
        </button>
        <button
          onclick="downloadLog()"
          class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded transition-all"
        >
          📄 Download Log
        </button>
      </div>

      <!-- Log -->
      <div id="log" class="bg-gray-800 rounded-lg p-4">
        <h3 class="text-lg font-bold mb-4">📋 Action Log</h3>
        <div id="logContent" class="text-gray-300 font-mono text-sm">
          Ready to check database...
        </div>
      </div>
    </div>

    <script>
      let actionLog = [];

      function log(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = `[${timestamp}] ${message}`;
        actionLog.push(logEntry);

        const logContent = document.getElementById("logContent");
        logContent.innerHTML = actionLog.slice(-10).join("<br>"); // Show last 10 entries

        // Update status
        document.getElementById("statusText").textContent = message;
        console.log(logEntry);
      }

      function checkDatabase() {
        log("🔍 Checking localStorage database...");

        try {
          const saved = localStorage.getItem("enhancedChampionsDatabase");
          if (saved) {
            const data = JSON.parse(saved);
            const championsCount = data.champions ? data.champions.length : 0;
            const dataSize = JSON.stringify(data).length;

            log(
              `✅ Found database: ${championsCount} champions, ${dataSize} bytes`
            );
          } else {
            log("❌ No database found in localStorage");
          }

          // Check other storage
          const keys = Object.keys(localStorage);
          const runekeys = keys.filter(
            (key) =>
              key.toLowerCase().includes("rune") ||
              key.toLowerCase().includes("champion")
          );

          if (runekeys.length > 0) {
            log(`📦 Found related keys: ${runekeys.join(", ")}`);
          } else {
            log("📦 No related storage keys found");
          }
        } catch (error) {
          log(`❌ Error checking database: ${error.message}`);
        }
      }

      function clearDatabase() {
        if (!confirm("⚠️ Are you sure you want to clear the database?")) {
          log("❌ Clear operation cancelled");
          return;
        }

        log("🗑️ Clearing localStorage database...");

        try {
          // Clear specific keys
          localStorage.removeItem("enhancedChampionsDatabase");
          localStorage.removeItem("runeterra_champions");
          localStorage.removeItem("champions_data");

          // Clear all rune-related keys
          const keys = Object.keys(localStorage);
          const runekeys = keys.filter(
            (key) =>
              key.toLowerCase().includes("rune") ||
              key.toLowerCase().includes("champion") ||
              key.toLowerCase().includes("league")
          );

          runekeys.forEach((key) => {
            localStorage.removeItem(key);
            log(`🗑️ Removed: ${key}`);
          });

          log("✅ Database cleared successfully");
        } catch (error) {
          log(`❌ Error clearing database: ${error.message}`);
        }
      }

      function reloadSample() {
        log("✨ Loading sample data...");

        try {
          clearDatabase();

          setTimeout(() => {
            log("🔄 Redirecting to main page with fresh data...");
            window.location.href = "main.html";
          }, 1000);
        } catch (error) {
          log(`❌ Error loading sample data: ${error.message}`);
        }
      }

      function goToMain() {
        log("🏠 Returning to main page...");
        window.location.href = "main.html";
      }

      function downloadLog() {
        const logText = actionLog.join("\\n");
        const blob = new Blob([logText], { type: "text/plain" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `runeterra-database-log-${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        log("📄 Log downloaded");
      }

      // Auto-check on load
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(checkDatabase, 500);
      });
    </script>
  </body>
</html>
